<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Gang of Pizza</title>
    <style>
        :root { --primary: #e74c3c; --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        h1 { color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #222; color: var(--primary); }
        
        select, input { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 5px; }
        .btn-save { background: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-save:hover { background: #27ae60; }
        
        #admin-error { color: #e74c3c; font-weight: bold; text-align: center; margin-top: 50px; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container" id="admin-panel" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>👑 Tour de Contrôle Administrateur</h1>
        <button onclick="window.location.href='production.html'" class="btn-save" style="background: #3498db;">Retour à l'App</button>
    </div>
    
    <p>Gérez les abonnements et les limites de vos franchisés ici.</p>

    <table>
        <thead>
            <tr>
                <th>ID Utilisateur (Supabase)</th>
                <th>Abonnement Actuel</th>
                <th>Max Machines</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="clients-list">
            </tbody>
    </table>
</div>

<div id="admin-error">Vérification des droits administrateur en cours...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
    const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function initAdmin() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = "index.html"; return; }

        // Vérifie si l'utilisateur est admin
        const { data: monProfil } = await supabaseClient.from('profiles').select('is_admin').eq('id', session.user.id).single();
        
        if (!monProfil || !monProfil.is_admin) {
            document.getElementById('admin-error').innerText = "Accès refusé. Vous n'êtes pas administrateur.";
            return;
        }

        // Affiche le panel
        document.getElementById('admin-error').style.display = "none";
        document.getElementById('admin-panel').style.display = "block";

        chargerClients();
    }

    async function chargerClients() {
        const { data: profils } = await supabaseClient.from('profiles').select('*');
        const tbody = document.getElementById('clients-list');
        tbody.innerHTML = "";

        profils.forEach(p => {
            if(p.is_admin) return; // On ne s'affiche pas soi-même
            
            tbody.innerHTML += `
                <tr>
                    <td style="font-size: 0.8rem; color: #888;">${p.id}</td>
                    <td>
                        <select id="abo-${p.id}">
                            <option value="Basic" ${p.type_abonnement === 'Basic' ? 'selected' : ''}>Basic (39€)</option>
                            <option value="Plus" ${p.type_abonnement === 'Plus' ? 'selected' : ''}>Plus (59€)</option>
                            <option value="Platinium" ${p.type_abonnement === 'Platinium' ? 'selected' : ''}>Platinium (69€)</option>
                            <option value="Ultimate" ${p.type_abonnement === 'Ultimate' ? 'selected' : ''}>Ultimate (99€)</option>
                            <option value="Sur-Mesure" ${p.type_abonnement === 'Sur-Mesure' ? 'selected' : ''}>Sur-Mesure</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" id="max-${p.id}" value="${p.max_distributeurs || 3}" style="width: 60px;">
                    </td>
                    <td>
                        <button class="btn-save" onclick="sauvegarderClient('${p.id}')">Enregistrer</button>
                    </td>
                </tr>
            `;
        });
    }

    async function sauvegarderClient(id) {
        const abo = document.getElementById(`abo-${id}`).value;
        const max = parseInt(document.getElementById(`max-${id}`).value);

        const { error } = await supabaseClient.from('profiles').update({ 
            type_abonnement: abo, 
            max_distributeurs: max 
        }).eq('id', id);

        if(!error) { alert("✅ Client mis à jour avec succès !"); }
        else { alert("Erreur lors de la mise à jour."); }
    }

    initAdmin();
</script>
</body>
</html>
