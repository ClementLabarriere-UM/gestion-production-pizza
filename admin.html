<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Espace Production</title>
    <style>
        :root { --primary: #e74c3c; --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        h1 { color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background: #222; color: var(--primary); font-size: 0.9rem; text-transform: uppercase; }
        
        .shop-name { font-weight: bold; font-size: 1.1rem; color: white; display: block; }
        .user-email { font-size: 0.8rem; color: #888; }

        select, input { background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 6px; font-weight: bold; }
        .btn-save { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-save:hover { background: #27ae60; transform: scale(1.02); }
        
        #admin-error { color: #e74c3c; font-weight: bold; text-align: center; margin-top: 50px; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container" id="admin-panel" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Gestion des Franchisés</h1>
        <button onclick="window.location.href='/production'" class="btn-save" style="background: #3498db;">Retour à l'App</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Boutique / Client</th>
                <th>Abonnement</th>
                <th>Max Machines</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="clients-list">
            </tbody>
    </table>
</div>

<div id="admin-error">Vérification des droits administrateur...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
    const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function initAdmin() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = "/connexion"; return; }

        const { data: monProfil } = await supabaseClient.from('profiles').select('is_admin').eq('id', session.user.id).single();
        
        if (!monProfil || !monProfil.is_admin) {
            document.getElementById('admin-error').innerText = "Accès refusé. Vous n'êtes pas administrateur.";
            return;
        }

        document.getElementById('admin-error').style.display = "none";
        document.getElementById('admin-panel').style.display = "block";

        chargerClients();
    }

    async function chargerClients() {
        // On récupère tous les profils (boutique, email, abo, max_dists)
        const { data: profils, error } = await supabaseClient.from('profiles').select('*').order('nom_boutique', { ascending: true });
        
        const tbody = document.getElementById('clients-list');
        tbody.innerHTML = "";

        if (error) { alert("Erreur lors de la récupération des clients."); return; }

        profils.forEach(p => {
            if(p.is_admin) return; // On masque ton propre compte admin
            
            // Si le nom de boutique n'est pas renseigné, on met un texte par défaut
            const nomAffichage = p.nom_boutique || "Boutique non nommée";

            tbody.innerHTML += `
                <tr>
                    <td>
                        <span class="shop-name">${nomAffichage}</span>
                        <span class="user-email">${p.email || 'Pas d\'email renseigné'}</span>
                    </td>
                    <td>
                        <select id="abo-${p.id}">
                            <option value="Basic" ${p.type_abonnement === 'Basic' ? 'selected' : ''}>Basic (39€)</option>
                            <option value="Plus" ${p.type_abonnement === 'Plus' ? 'selected' : ''}>Plus (59€)</option>
                            <option value="Platinium" ${p.type_abonnement === 'Platinium' ? 'selected' : ''}>Platinium (69€)</option>
                            <option value="Ultimate" ${p.type_abonnement === 'Ultimate' ? 'selected' : ''}>Ultimate (99€)</option>
                            <option value="Sur-Mesure" ${p.type_abonnement === 'Sur-Mesure' ? 'selected' : ''}>Sur-Mesure</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" id="max-${p.id}" value="${p.max_distributeurs || 3}" style="width: 70px;">
                    </td>
                    <td>
                        <button class="btn-save" onclick="sauvegarderClient('${p.id}')">Mettre à jour</button>
                    </td>
                </tr>
            `;
        });
    }

    async function sauvegarderClient(id) {
        const abo = document.getElementById(`abo-${id}`).value;
        const max = parseInt(document.getElementById(`max-${id}`).value);

        const { error } = await supabaseClient.from('profiles').update({ 
            type_abonnement: abo, 
            max_distributeurs: max 
        }).eq('id', id);

        if(!error) { 
            alert("✅ Modification enregistrée avec succès !");
            chargerClients();
        } else { 
            alert("Erreur technique : la mise à jour a échoué."); 
        }
    }

    initAdmin();
</script>
</body>
</html>
