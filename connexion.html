<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connexion - Espace Production by digiclem.</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- MODE SOMBRE ET CLAIR --- */
        :root { --primary: #e74c3c; --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333; --input-bg: #2a2a2a; }
        body.light-mode { --bg: #f4f4f9; --card-bg: #ffffff; --text: #333333; --border: #dddddd; --input-bg: #eeeeee; }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            transition: background-color 0.3s;
        }

        .login-box { 
            background: var(--card-bg); 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
            border: 1px solid var(--border);
            box-sizing: border-box;
            margin: 20px;
        }

        .logo-area { margin-bottom: 30px; }
        .logo-area p { margin: 0 0 5px 0; color: #888; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .logo-area img { height: 70px; margin-bottom: 10px; }
        
        /* Gestion Logos Thème */
        .logo-light { display: none; }
        body.light-mode .logo-dark { display: none; }
        body.light-mode .logo-light { display: inline-block; }

        h2 { margin-top: 0; margin-bottom: 25px; color: var(--primary); font-size: 1.5rem; }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input { 
            width: 100%; 
            padding: 14px 15px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            background: var(--input-bg); 
            color: var(--text); 
            box-sizing: border-box; 
            font-size: 1rem;
            transition: all 0.2s;
        }
        .input-group input:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1); 
        }

        .btn-login { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1.1rem; 
            transition: 0.2s; 
            margin-top: 10px;
        }
        .btn-login:hover { background: #c0392b; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3); }
        .btn-login:active { transform: translateY(1px); }

        #error-msg { 
            color: #ff6b6b; 
            font-size: 0.9rem; 
            margin-top: 15px; 
            min-height: 20px; 
            font-weight: bold;
        }

        .legal-link {
            display: inline-block;
            margin-top: 25px;
            color: #888;
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .legal-link:hover { color: var(--primary); text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-area">
            <p>Espace Production by</p>
            <img src="logo.png" alt="Logo" class="logo-dark" onerror="this.style.display='none'">
            <img src="logo-clair.png" alt="Logo" class="logo-light" onerror="this.style.display='none'">
        </div>
        
        <h2>Connexion</h2>
        
        <div class="input-group">
            <input type="email" id="email" placeholder="Adresse email" autocomplete="email">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password">
        </div>
        
        <button class="btn-login" onclick="seConnecter()">Se connecter</button>
        <p id="error-msg"></p>

        <a href="/mentions-legales" class="legal-link">Mentions légales & Confidentialité</a>
    </div>

    <script>
        // Restauration du thème si l'utilisateur l'avait changé
        if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

        // Touche Entrée pour valider
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') seConnecter();
        });

        const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
        const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Vérifie si déjà connecté
        async function verifierSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = "/production";
            }
        }
        verifierSession();

        async function seConnecter() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (!email || !password) {
                errorMsg.innerText = "Merci de remplir tous les champs.";
                errorMsg.style.color = "#ff6b6b";
                return;
            }

            errorMsg.style.color = "#3498db";
            errorMsg.innerText = "Connexion en cours...";

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    errorMsg.style.color = "#ff6b6b";
                    errorMsg.innerText = "Identifiants incorrects.";
                } else {
                    window.location.href = "/production";
                }
            } catch (err) {
                errorMsg.style.color = "#ff6b6b";
                errorMsg.innerText = "Une erreur technique est survenue.";
            }
        }
    </script>
</body>
</html>
