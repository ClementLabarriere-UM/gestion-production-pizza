<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Distributeurs - Gang of Pizza</title>
    <style>
        :root { --primary: #e74c3c; --bg: #f4f4f9; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        
        /* Menu */
        .nav-menu { margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-menu a { text-decoration: none; padding: 10px 20px; background: #eee; color: #333; border-radius: 8px; font-weight: bold; }
        .nav-menu a.active { background: var(--primary); color: white; }
        
        /* Boutons et Jauge */
        .btn-action { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; background: #3498db; font-size: 16px; margin-bottom: 20px; }
        .btn-action:disabled { background: #ccc; cursor: not-allowed; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        
        .status-box { background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #3498db; }
        
        /* Grille des distributeurs */
        .dist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .dist-card { background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .dist-card h4 { margin: 0; color: #2c3e50; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏪 Mes Distributeurs</h1>
        <button onclick="seDeconnecter()" style="padding: 8px 15px; background: #555; color: white; border: none; border-radius: 5px; cursor: pointer;">Déconnexion</button>
    </div>

    <div class="nav-menu">
        <a href="production.html">🍕 Production</a>
        <a href="stocks.html">📦 Stocks & Livraisons</a>
        <a href="distributeurs.html">🏪 Mes Distributeurs</a>
        <a href="historique.html" class="active">⏳ Historique</a>
    </div>

    <div class="status-box" id="info-abonnement">
        Chargement de votre abonnement...
    </div>

    <button id="btn-ajouter" class="btn-action" onclick="ajouterDistributeur()">+ Ajouter un Distributeur</button>

    <div id="liste-distributeurs" class="dist-grid">
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
    const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let maxDistributeurs = 0;
    let nbActuels = 0;

    async function verifierConnexion() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = "index.html";
            return;
        }
        currentUser = session.user;
        chargerDonnees();
    }

    async function seDeconnecter() {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
    }

    async function chargerDonnees() {
        // 1. On récupère la limite d'abonnement du franchisé
        const { data: profil } = await supabaseClient
            .from('profiles')
            .select('max_distributeurs, type_abonnement')
            .eq('id', currentUser.id)
            .single();
            
        if(profil) {
            maxDistributeurs = profil.max_distributeurs;
        }

        // 2. On récupère ses distributeurs actuels
        const { data: distributeurs, error } = await supabaseClient
            .from('distributeurs')
            .select('*')
            .order('created_at', { ascending: true });

        if (error) {
            console.error(error);
            return;
        }

        nbActuels = distributeurs.length;
        
        // 3. Mise à jour de l'affichage (Jauge + Bouton)
        const infoBox = document.getElementById('info-abonnement');
        infoBox.innerHTML = `<strong>Abonnement ${profil.type_abonnement}</strong> : Vous utilisez ${nbActuels} emplacement(s) sur ${maxDistributeurs} autorisés.`;
        
        const btnAjouter = document.getElementById('btn-ajouter');
        if (nbActuels >= maxDistributeurs) {
            btnAjouter.disabled = true;
            btnAjouter.innerText = "Limite d'abonnement atteinte";
            infoBox.style.borderLeftColor = "#e74c3c";
            infoBox.style.backgroundColor = "#fadbd8";
        } else {
            btnAjouter.disabled = false;
            btnAjouter.innerText = "+ Ajouter un Distributeur";
            infoBox.style.borderLeftColor = "#3498db";
            infoBox.style.backgroundColor = "#e8f4f8";
        }

        // 4. Affichage de la liste
        const container = document.getElementById('liste-distributeurs');
        if (nbActuels === 0) {
            container.innerHTML = `<p style="color: #777;">Aucun distributeur configuré.</p>`;
            return;
        }

        container.innerHTML = distributeurs.map(d => `
            <div class="dist-card">
                <h4>📍 ${d.nom}</h4>
                <button class="btn-delete" onclick="supprimerDistributeur('${d.id}')">X</button>
            </div>
        `).join('');
    }

    async function ajouterDistributeur() {
        if (nbActuels >= maxDistributeurs) {
            alert("Vous avez atteint la limite de votre abonnement. Veuillez contacter la direction pour passer à l'offre supérieure.");
            return;
        }

        const nom = prompt("Nom ou Emplacement du nouveau distributeur (ex: Gare SNCF) :");
        if (!nom) return;

        const { error } = await supabaseClient
            .from('distributeurs')
            .insert([{ 
                user_id: currentUser.id,
                nom: nom 
            }]);

        if (error) {
            alert("Erreur lors de l'ajout : " + error.message);
        } else {
            chargerDonnees(); // On rafraîchit la page
        }
    }

    async function supprimerDistributeur(idDistributeur) {
        if (!confirm("Voulez-vous vraiment supprimer ce distributeur ?")) return;

        const { error } = await supabaseClient
            .from('distributeurs')
            .delete()
            .eq('id', idDistributeur);

        if (error) {
            alert("Erreur lors de la suppression : " + error.message);
        } else {
            chargerDonnees(); // On rafraîchit la page
        }
    }

    verifierConnexion();
</script>

</body>
</html>
