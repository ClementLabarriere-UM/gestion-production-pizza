<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique - Gang of Pizza</title>
    <style>
        :root { --primary: #e74c3c; --bg: #f4f4f9; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .nav-menu { margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-menu a { text-decoration: none; padding: 10px 20px; background: #eee; color: #333; border-radius: 8px; font-weight: bold; }
        .nav-menu a.active { background: var(--primary); color: white; }
        
        .history-item { background: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 4px solid #f39c12; margin-bottom: 10px; }
        .history-date { font-size: 0.9em; color: #777; margin-bottom: 5px; }
        .history-details { font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⏳ Historique de Production</h1>
        <button onclick="seDeconnecter()" style="padding: 8px 15px; background: #555; color: white; border: none; border-radius: 5px; cursor: pointer;">Déconnexion</button>
    </div>

    <div class="nav-menu">
        <a href="production.html">🍕 Production</a>
        <a href="stocks.html">📦 Stocks & Livraisons</a>
        <a href="distributeurs.html">🏪 Mes Distributeurs</a>
        <a href="historique.html" class="active">⏳ Historique</a>
    </div>

    <div id="liste-historique">
        <p style="color: #777;">Chargement de l'historique...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
    const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function verifierConnexion() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = "index.html"; return; }
        chargerHistorique();
    }

    async function chargerHistorique() {
        const { data: historique, error } = await supabaseClient
            .from('historique')
            .select('*')
            .order('date_production', { ascending: false });

        const container = document.getElementById('liste-historique');
        
        if (error || historique.length === 0) {
            container.innerHTML = `<p style="color: #777;">Aucune production enregistrée pour le moment.</p>`;
            return;
        }

        container.innerHTML = historique.map(h => {
            const date = new Date(h.date_production).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
            return `
                <div class="history-item">
                    <div class="history-date">📅 Le ${date}</div>
                    <div class="history-details">${h.resume_pizzas}</div>
                </div>
            `;
        }).join('');
    }

    async function seDeconnecter() {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
    }

    verifierConnexion();
</script>

</body>
</html>
