<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gang of Pizza</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #2a2a2a; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 350px; text-align: center; border: 1px solid #e74c3c; }
        img { width: 150px; margin-bottom: 20px; }
        h2 { margin-bottom: 20px; color: #e74c3c; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #444; border-radius: 6px; background: #333; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #c0392b; }
        #error-msg { color: #ff6b6b; font-size: 14px; margin-top: 15px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="login-box">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <h2>Espace Franchisé</h2>
        <input type="email" id="email" placeholder="Adresse Email">
        <input type="password" id="password" placeholder="Mot de passe">
        <button onclick="seConnecter()">Se connecter</button>
        <p id="error-msg"></p>
    </div>

    <script>
        const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
        const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function seConnecter() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (!email || !password) {
                errorMsg.innerText = "Merci de remplir tous les champs.";
                return;
            }

            errorMsg.style.color = "#3498db";
            errorMsg.innerText = "Connexion en cours...";

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    errorMsg.style.color = "#ff6b6b";
                    errorMsg.innerText = "Erreur : " + error.message;
                } else {
                    window.location.href = "production.html";
                }
            } catch (err) {
                errorMsg.style.color = "#ff6b6b";
                errorMsg.innerText = "Une erreur technique est survenue.";
            }
        }
    </script>
</body>
</html>
