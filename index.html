<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gang of Pizza</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #c0392b; }
        #error-msg { color: red; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Espace Franchisé</h2>
        <input type="email" id="email" placeholder="Adresse Email">
        <input type="password" id="password" placeholder="Mot de passe">
        <button onclick="seConnecter()">Se connecter</button>
        <p id="error-msg"></p>
    </div>

    <script>
        // 1. Initialisation de Supabase
        const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
        const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        console.log("Script Supabase chargé et initialisé.");

        // 2. Fonction de connexion
        async function seConnecter() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (!email || !password) {
                errorMsg.innerText = "Merci de remplir tous les champs.";
                return;
            }

            errorMsg.style.color = "blue";
            errorMsg.innerText = "Connexion en cours...";
            console.log("Tentative de connexion pour :", email);

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    console.error("Erreur détectée :", error.message);
                    errorMsg.style.color = "red";
                    errorMsg.innerText = "Erreur : " + error.message;
                } else {
                    console.log("Connexion réussie ! Redirection...");
                    window.location.href = "production.html";
                }
            } catch (err) {
                console.error("Erreur critique :", err);
                errorMsg.style.color = "red";
                errorMsg.innerText = "Une erreur technique est survenue.";
            }
        }
    </script>
</body>
</html>
