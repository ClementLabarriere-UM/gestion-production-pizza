<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gang of Pizza - Gestion de Production</title>
    <style>
        /* Garde tout ton CSS habituel ici (je le raccourcis pour la lisibilité) */
        :root { --primary: #e74c3c; --bg: #f4f4f9; --text: #333; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 10px 20px; background: #eee; border-radius: 8px; cursor: pointer; border: none; font-weight: 600; white-space: nowrap; }
        .tab.active { background: var(--primary); color: white; }
        .content-section { display: none; }
        .content-section.active { display: block; }
        /* Checklist styles */
        .ing-category { margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary); }
        .checklist-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        .highlight { font-weight: bold; color: var(--primary); margin-left: 5px; }
        .btn-action { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Gang of Pizza</h1>
        <div>
            <span id="user-email" style="margin-right: 10px; font-size: 0.9em; color: #666;"></span>
            <button onclick="seDeconnecter()" class="btn-action" style="background: #555; color: white;">Déconnexion</button>
        </div>
    </div>

    <div class="nav-menu">
        <a href="production.html">🍕 Production</a>
        <a href="stocks.html">📦 Stocks & Livraisons</a>
        <a href="distributeurs.html">🏪 Mes Distributeurs</a>
        <a href="historique.html" class="active">⏳ Historique</a>
    </div>

    <div id="carte" class="content-section active">
        <h3>Sélectionnez les pizzas à produire</h3>
        <div id="liste-pizzas-selection" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;"></div>
    </div>

    <div id="production" class="content-section">
        <h3>Quantités à produire</h3>
        <div id="entree-production"></div>
    </div>

    <div id="checklist" class="content-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Ingrédients nécessaires</h3>
            <div>
                <button onclick="window.print()" class="btn-action" style="background: #3498db; color: white;">Imprimer</button>
                <button onclick="validerProduction()" class="btn-action" style="background: #2ecc71; color: white;">✅ Valider & Déduire des stocks</button>
            </div>
        </div>
        <div id="liste-ingredients"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
    const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;

    // --- FONCTION DE VALIDATION ET DÉDUCTION ---
    async function validerProduction() {
        if(!confirm("Confirmer la production ? Cela va déduire les ingrédients de vos stocks.")) return;

        const inputs = document.querySelectorAll('.prod-input');
        const besoins = {};
        const pizzasProduites = [];

        // 1. On rassemble ce qui a été produit
        inputs.forEach(input => {
            const quantite = parseInt(input.value) || 0;
            if (quantite > 0) {
                const nomPizza = input.dataset.pizza;
                pizzasProduites.push(`${quantite}x ${nomPizza}`);
                
                const recette = recettes[nomPizza];
                if (recette) {
                    for (let [ing, q] of Object.entries(recette)) {
                        let finalIng = ing;
                        let finalQ = q * quantite;
                        if(ing === "Camembert (demi)") { finalIng = "Camembert (entier)"; finalQ = finalQ / 2; }
                        besoins[finalIng] = (besoins[finalIng] || 0) + finalQ;
                    }
                }
            }
        });

        if (pizzasProduites.length === 0) {
            alert("Vous n'avez saisi aucune quantité à produire !");
            return;
        }

        // 2. On met à jour les stocks dans Supabase (Déduction)
        for (let [ingredient, quantiteRequise] of Object.entries(besoins)) {
            // On cherche le stock actuel de cet ingrédient
            const { data: stockExistant } = await supabaseClient
                .from('stocks')
                .select('*')
                .eq('nom_ingredient', ingredient)
                .single();

            if (stockExistant) {
                // On soustrait
                const nouveauStock = stockExistant.quantite - quantiteRequise;
                await supabaseClient
                    .from('stocks')
                    .update({ quantite: nouveauStock })
                    .eq('id', stockExistant.id);
            } else {
                // S'il n'était pas en stock, on le crée en négatif pour alerter le franchisé
                await supabaseClient
                    .from('stocks')
                    .insert([{ user_id: currentUser.id, nom_ingredient: ingredient, quantite: -quantiteRequise }]);
            }
        }

        // 3. On enregistre dans l'historique
        await supabaseClient
            .from('historique')
            .insert([{ user_id: currentUser.id, resume_pizzas: pizzasProduites.join(' | ') }]);

        // 4. On nettoie l'écran
        inputs.forEach(input => input.value = 0);
        calculerBesoins();
        alert("Production validée ! Les stocks ont été mis à jour.");
    }

    // --- SÉCURITÉ ---
    async function verifierConnexion() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = "index.html";
            return;
        }
        currentUser = session.user;
        document.getElementById('user-email').innerText = currentUser.email;
        initApp();
    }

    async function seDeconnecter() {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
    }

    // --- LOGIQUE PIZZA ---
    const pizzas = [
        { id: 'reine', nom: 'Reine', base: 'Rouge' },
        { id: 'cannibale', nom: 'Cannibale', base: 'Rouge' },
        { id: '4_fromages', nom: '4 Fromages', base: 'Rouge' },
        { id: 'burger', nom: 'Burger', base: 'Rouge' },
        { id: 'maxi_burger', nom: 'Maxi Burger', base: 'Rouge' },
        { id: 'orientale', nom: 'Orientale', base: 'Rouge' },
        { id: 'chevre_miel', nom: 'Chèvre-Miel', base: 'Blanche' },
        { id: 'savoyarde', nom: 'Savoyarde', base: 'Blanche' },
        { id: 'indiana', nom: 'Indiana', base: 'Blanche' },
        { id: 'viking', nom: 'Viking', base: 'Rouge' }
        // Ajoute ici toutes tes pizzas...
    ];

    const recettes = {
        "Reine": {"Disque tomaté": 1, "Jambon (g)": 60, "Emmental râpé (g)": 30, "Scalarella (g)": 80, "Olives noires (unités)": 3},
        "Cannibale": {"Disque tomaté": 1, "Merguez (rondelles)": 15, "Poulet rôti (g)": 30, "Egrené au boeuf (g)": 40, "Sauce hot BBQ (g)": 18, "Scalarella (g)": 110},
        "4 Fromages": {"Disque tomaté": 1, "Roquefort (g)": 15, "Emmental râpé (g)": 30, "Scalarella (g)": 80, "Chèvre (tranches)": 6, "Olives noires (unités)": 3},
        "Burger": {"Disque tomaté": 1, "Oignons pré-frits (g)": 20, "Egrené au boeuf (g)": 70, "Sauce burger (g)": 25, "Cornichons (rondelles)": 7, "Scalarella + Cheddar (g)": 110},
        "Chèvre-Miel": {"Disque crémé": 1, "Scalarella (g)": 120, "Miel (g)": 20, "Chèvre (tranches)": 8, "Olives noires (unités)": 3},
        "Viking": {"Disque tomaté": 1, "Boursin(g)": 40, "Saumon fumé (g)": 70, "Scalarella (g)": 110}
        // ... complète avec tes recettes
    };

    function initApp() {
        renderCarte();
        chargerSelection();
    }

    function renderCarte() {
        const container = document.getElementById('liste-pizzas-selection');
        container.innerHTML = pizzas.map(p => `
            <label style="display: block; padding: 10px; background: #f9f9f9; border-radius: 6px; cursor: pointer;">
                <input type="checkbox" value="${p.nom}" onchange="majSelection()"> ${p.nom}
            </label>
        `).join('');
    }

    function majSelection() {
        const checkboxes = document.querySelectorAll('#liste-pizzas-selection input:checked');
        const selection = Array.from(checkboxes).map(cb => cb.value);
        localStorage.setItem('pizzas_selectionnees', JSON.stringify(selection));
        renderProduction(selection);
    }

    function chargerSelection() {
        const saved = JSON.parse(localStorage.getItem('pizzas_selectionnees') || '[]');
        const checkboxes = document.querySelectorAll('#liste-pizzas-selection input');
        checkboxes.forEach(cb => {
            if(saved.includes(cb.value)) cb.checked = true;
        });
        renderProduction(saved);
    }

    function renderProduction(selection) {
        const container = document.getElementById('entree-production');
        container.innerHTML = selection.map(nom => `
            <div style="margin-bottom: 10px;">
                <label style="width: 150px; display: inline-block;">${nom}</label>
                <input type="number" class="prod-input" data-pizza="${nom}" value="0" min="0" onchange="calculerBesoins()" style="width: 60px; padding: 5px;">
            </div>
        `).join('');
        calculerBesoins();
    }

    function calculerBesoins() {
        const inputs = document.querySelectorAll('.prod-input');
        const besoins = {};

        inputs.forEach(input => {
            const nomPizza = input.dataset.pizza;
            const quantite = parseInt(input.value) || 0;
            const recette = recettes[nomPizza];

            if (recette) {
                for (let [ing, q] of Object.entries(recette)) {
                    // Logique Camembert/Reblochon
                    let finalIng = ing;
                    let finalQ = q * quantite;
                    if(ing === "Camembert (demi)") { finalIng = "Camembert (entier)"; finalQ = finalQ / 2; }
                    
                    besoins[finalIng] = (besoins[finalIng] || 0) + finalQ;
                }
            }
        });
        renderChecklist(besoins);
    }

    function renderChecklist(ing) {
        const dI = document.getElementById("liste-ingredients");
        dI.innerHTML = "";
        let cV = [], cF = [], cD = [], cA = [];

        for (let [n, q] of Object.entries(ing)) {
            if (q <= 0) continue;
            let displayQ = q >= 1000 ? (q/1000).toFixed(2) + " Kg" : q;
            let li = `<div class="checklist-item"><label><input type="checkbox"> <span>${n} : <span class="highlight">${displayQ}</span></span></label></div>`;
            
            if (n.includes("Disque")) cD.push(li);
            else if (n.toLowerCase().match(/boeuf|poulet|jambon|merguez|kebab|allumettes/)) cV.push(li);
            else if (n.toLowerCase().match(/mozzarella|chèvre|raclette|reblochon|parmesan|emmental|scalarella|camembert|roquefort/)) cF.push(li);
            else cA.push(li);
        }

        if(cD.length) dI.innerHTML += `<div class="ing-category"><h4>🍕 Disques</h4>${cD.join("")}</div>`;
        if(cV.length) dI.innerHTML += `<div class="ing-category"><h4>🥩 Viandes</h4>${cV.join("")}</div>`;
        if(cF.length) dI.innerHTML += `<div class="ing-category"><h4>🧀 Fromages</h4>${cF.join("")}</div>`;
        if(cA.length) dI.innerHTML += `<div class="ing-category"><h4>🧅 Autres</h4>${cA.join("")}</div>`;
    }

    function showTab(tabId) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // Lancement
    verifierConnexion();
</script>

</body>
</html>
