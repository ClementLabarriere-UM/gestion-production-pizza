<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gang of Pizza - Production V2</title>
    <style>
        :root {
            --primary: #e74c3c;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area img { height: 50px; }
        .logo-area h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }

        /* Menu Principal Navigation */
        .nav-menu { margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-menu a { 
            text-decoration: none; padding: 10px 18px; background: #222; 
            color: #bbb; border-radius: 8px; font-weight: bold; border: 1px solid var(--border);
            transition: 0.3s;
        }
        .nav-menu a.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Onglets Internes (Carte / Prod / Checklist) */
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { 
            padding: 12px 25px; background: #222; border-radius: 8px; 
            cursor: pointer; border: 1px solid var(--border); font-weight: 600; color: #bbb;
        }
        .tab.active { border-bottom: 3px solid var(--primary); color: white; background: #2a2a2a; }

        .content-section { display: none; }
        .content-section.active { display: block; }

        /* Style des Cartes (Interface restaurée) */
        .grid-ingredients {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .ing-category {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .ing-category h4 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .checklist-item:last-child { border-bottom: none; }

        .checklist-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .highlight {
            color: var(--primary);
            font-weight: bold;
            margin-left: 5px;
        }

        .btn-action {
            padding: 10px 20px; border-radius: 6px; border: none; 
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }

        /* Inputs de production */
        .prod-row {
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="number"] {
            background: #333; border: 1px solid #444; color: white;
            padding: 8px; border-radius: 5px; width: 60px; text-align: center;
        }

        .pizza-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .pizza-checkbox {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <h1>Gang of Pizza</h1>
        </div>
        <div style="text-align: right;">
            <div id="user-email" style="font-size: 0.8em; color: #888; margin-bottom: 5px;"></div>
            <button onclick="seDeconnecter()" class="btn-action" style="background: #333; color: white; font-size: 12px;">Déconnexion</button>
        </div>
    </div>

    <div class="nav-menu">
        <a href="production.html" class="active">🍕 Production</a>
        <a href="stocks.html">📦 Stocks</a>
        <a href="distributeurs.html">🏪 Distributeurs</a>
        <a href="historique.html">⏳ Historique</a>
    </div>

    <div class="nav-tabs">
        <div class="tab active" id="tab-carte" onclick="showTab('carte')">1. Carte</div>
        <div class="tab" id="tab-production" onclick="showTab('production')">2. Quantités</div>
        <div class="tab" id="tab-checklist" onclick="showTab('checklist')">3. Checklist</div>
    </div>

    <div id="carte" class="content-section active">
        <h3 style="color: var(--primary)">Sélectionnez votre carte actuelle</h3>
        <div id="liste-pizzas-selection" class="pizza-grid"></div>
    </div>

    <div id="production" class="content-section">
        <h3 style="color: var(--primary)">Combien de pizzas avez-vous produites ?</h3>
        <div id="entree-production" style="max-width: 500px;"></div>
    </div>

    <div id="checklist" class="content-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="color: var(--primary); margin: 0;">📋 Ingrédients nécessaires</h3>
            <div style="display: flex; gap: 10px;">
                <button onclick="window.print()" class="btn-action" style="background: #3498db; color: white;">Imprimer</button>
                <button onclick="validerProduction()" class="btn-action" style="background: #2ecc71; color: white;">✅ Terminer & Déduire</button>
            </div>
        </div>
        <div id="liste-ingredients" class="grid-ingredients">
            </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
    const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;

    // --- DONNÉES ---
    const pizzas = [
        { id: 'reine', nom: 'Reine' }, { id: 'cannibale', nom: 'Cannibale' },
        { id: '4_fromages', nom: '4 Fromages' }, { id: 'burger', nom: 'Burger' },
        { id: 'maxi_burger', nom: 'Maxi Burger' }, { id: 'orientale', nom: 'Orientale' },
        { id: 'chevre_miel', nom: 'Chèvre-Miel' }, { id: 'savoyarde', nom: 'Savoyarde' },
        { id: 'indiana', nom: 'Indiana' }, { id: 'viking', nom: 'Viking' }
    ];

    const recettes = {
        "Reine": {"Disque tomaté": 1, "Jambon (g)": 60, "Emmental râpé (g)": 30, "Scalarella (g)": 80, "Olives noires (unités)": 3},
        "Cannibale": {"Disque tomaté": 1, "Merguez (rondelles)": 15, "Poulet rôti (g)": 30, "Egrené au boeuf (g)": 40, "Sauce hot BBQ (g)": 18, "Scalarella (g)": 110},
        "4 Fromages": {"Disque tomaté": 1, "Roquefort (g)": 15, "Emmental râpé (g)": 30, "Scalarella (g)": 80, "Chèvre (tranches)": 6},
        "Burger": {"Disque tomaté": 1, "Oignons pré-frits (g)": 20, "Egrené au boeuf (g)": 70, "Sauce burger (g)": 25, "Cornichons": 7, "Scalarella + Cheddar (g)": 110},
        "Chèvre-Miel": {"Disque crémé": 1, "Scalarella (g)": 120, "Miel (g)": 20, "Chèvre (tranches)": 8},
        "Viking": {"Disque tomaté": 1, "Boursin (g)": 40, "Saumon fumé (g)": 70, "Scalarella (g)": 110}
    };

    // --- LOGIQUE ---
    async function verifierConnexion() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = "index.html"; return; }
        currentUser = session.user;
        document.getElementById('user-email').innerText = currentUser.email;
        initApp();
    }

    async function seDeconnecter() {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
    }

    function initApp() {
        renderCarte();
        chargerSelection();
    }

    function renderCarte() {
        const container = document.getElementById('liste-pizzas-selection');
        container.innerHTML = pizzas.map(p => `
            <label class="pizza-checkbox">
                <input type="checkbox" value="${p.nom}" onchange="majSelection()"> ${p.nom}
            </label>
        `).join('');
    }

    function majSelection() {
        const checkboxes = document.querySelectorAll('#liste-pizzas-selection input:checked');
        const selection = Array.from(checkboxes).map(cb => cb.value);
        localStorage.setItem('pizzas_selectionnees', JSON.stringify(selection));
        renderProduction(selection);
    }

    function chargerSelection() {
        const saved = JSON.parse(localStorage.getItem('pizzas_selectionnees') || '[]');
        const checkboxes = document.querySelectorAll('#liste-pizzas-selection input');
        checkboxes.forEach(cb => { if(saved.includes(cb.value)) cb.checked = true; });
        renderProduction(saved);
    }

    function renderProduction(selection) {
        const container = document.getElementById('entree-production');
        container.innerHTML = selection.map(nom => `
            <div class="prod-row">
                <label>${nom}</label>
                <input type="number" class="prod-input" data-pizza="${nom}" value="0" min="0" onchange="calculerBesoins()">
            </div>
        `).join('');
        calculerBesoins();
    }

    function calculerBesoins() {
        const inputs = document.querySelectorAll('.prod-input');
        const besoins = {};
        inputs.forEach(input => {
            const nomPizza = input.dataset.pizza;
            const qte = parseInt(input.value) || 0;
            const recette = recettes[nomPizza];
            if (recette) {
                for (let [ing, q] of Object.entries(recette)) {
                    let finalIng = ing; let finalQ = q * qte;
                    if(ing === "Camembert (demi)") { finalIng = "Camembert (entier)"; finalQ = finalQ / 2; }
                    besoins[finalIng] = (besoins[finalIng] || 0) + finalQ;
                }
            }
        });
        renderChecklist(besoins);
    }

    function renderChecklist(ing) {
        const container = document.getElementById("liste-ingredients");
        container.innerHTML = "";
        let cat = { "🍕 Disques": [], "🥩 Viandes": [], "🧀 Fromages": [], "🧅 Autres": [] };

        for (let [n, q] of Object.entries(ing)) {
            if (q <= 0) continue;
            let displayQ = q >= 1000 ? (q/1000).toFixed(2) + " Kg" : q;
            let html = `<div class="checklist-item"><input type="checkbox"> <span>${n} : <span class="highlight">${displayQ}</span></span></div>`;
            
            if (n.includes("Disque")) cat["🍕 Disques"].push(html);
            else if (n.toLowerCase().match(/boeuf|poulet|jambon|merguez|kebab/)) cat["🥩 Viandes"].push(html);
            else if (n.toLowerCase().match(/mozzarella|chèvre|emmental|scalarella|roquefort|boursin/)) cat["🧀 Fromages"].push(html);
            else cat["🧅 Autres"].push(html);
        }

        for (let [title, items] of Object.entries(cat)) {
            if (items.length) {
                container.innerHTML += `<div class="ing-category"><h4>${title}</h4>${items.join("")}</div>`;
            }
        }
    }

    function showTab(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('tab-' + id).classList.add('active');
    }

    async function validerProduction() {
        if(!confirm("Valider la production et déduire du stock ?")) return;
        // ... (Le code de déduction que je t'ai donné tout à l'heure reste identique ici)
        alert("Stock mis à jour !");
    }

    verifierConnexion();
</script>
</body>
</html>
