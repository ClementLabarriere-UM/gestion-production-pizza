<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks - Gang of Pizza</title>
    <style>
        :root { --primary: #e74c3c; --bg: #f4f4f9; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .nav-menu { margin-bottom: 20px; }
        .nav-menu a { text-decoration: none; padding: 10px 20px; background: #eee; color: #333; border-radius: 8px; font-weight: bold; margin-right: 10px; }
        .nav-menu a.active { background: var(--primary); color: white; }
        .btn-action { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; background: #2ecc71; font-size: 16px; margin-bottom: 20px; }
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .stock-card { background: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .stock-name { font-weight: bold; }
        .stock-qty { background: var(--primary); color: white; padding: 5px 10px; border-radius: 20px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📦 Gestion des Stocks</h1>
        <button onclick="seDeconnecter()" style="padding: 8px 15px; background: #555; color: white; border: none; border-radius: 5px; cursor: pointer;">Déconnexion</button>
    </div>

    <div class="nav-menu">
        <a href="production.html">🍕 Production</a>
        <a href="stocks.html" class="active">📦 Stocks & Livraisons</a>
    </div>

    <button class="btn-action" onclick="ajouterLivraison()">+ Ajouter une Livraison</button>

    <h3>Stock Actuel</h3>
    <div id="liste-stocks" class="stock-grid">
        <p style="color: #777;">Chargement des stocks...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. INITIALISATION
    const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
    const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;

    // 2. SÉCURITÉ ET LANCEMENT
    async function verifierConnexion() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = "index.html";
            return;
        }
        currentUser = session.user;
        chargerStocks(); // On charge les stocks une fois connecté
    }

    async function seDeconnecter() {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
    }

    // 3. LECTURE DES STOCKS DEPUIS LA BASE DE DONNÉES
    async function chargerStocks() {
        // Supabase filtrera automatiquement pour ne renvoyer que les stocks de l'utilisateur connecté grâce aux règles RLS créées précédemment !
        const { data: stocks, error } = await supabaseClient
            .from('stocks')
            .select('*')
            .order('nom_ingredient', { ascending: true });

        const container = document.getElementById('liste-stocks');
        
        if (error) {
            console.error("Erreur de chargement :", error);
            container.innerHTML = `<p style="color: red;">Erreur lors du chargement des stocks.</p>`;
            return;
        }

        if (stocks.length === 0) {
            container.innerHTML = `<p style="color: #777;">Votre stock est vide. Ajoutez une livraison !</p>`;
            return;
        }

        // Affichage des cartes de stock
        container.innerHTML = stocks.map(item => `
            <div class="stock-card">
                <span class="stock-name">${item.nom_ingredient}</span>
                <span class="stock-qty">${item.quantite}</span>
            </div>
        `).join('');
    }

    // 4. AJOUT D'UNE LIVRAISON (AVEC CONVERSION)
    async function ajouterLivraison() {
        let nom = prompt("Nom de l'ingrédient livré (ex: Emmental râpé) :");
        if (!nom) return; // Annulation

        // --- CONVERSION AUTOMATIQUE POUR LES FROMAGES ---
        if(nom.toLowerCase().includes("camembert")) nom = "Camembert (entier)";
        if(nom.toLowerCase().includes("reblochon")) nom = "Reblochon (entier)";
        // ------------------------------------------------

        let quantiteAjout = parseFloat(prompt(`Quantité reçue pour : ${nom} ?`));
        if (isNaN(quantiteAjout) || quantiteAjout <= 0) {
            alert("Quantité invalide.");
            return;
        }

        // Étape A : Vérifier si l'ingrédient existe déjà dans le stock de ce franchisé
        const { data: existant } = await supabaseClient
            .from('stocks')
            .select('*')
            .eq('nom_ingredient', nom)
            .single();

        if (existant) {
            // L'ingrédient existe : on additionne
            const nouvelleQuantite = existant.quantite + quantiteAjout;
            await supabaseClient
                .from('stocks')
                .update({ quantite: nouvelleQuantite })
                .eq('id', existant.id);
        } else {
            // Nouvel ingrédient : on l'insère (user_id est géré automatiquement, mais on peut le forcer par sécurité)
            await supabaseClient
                .from('stocks')
                .insert([{ 
                    user_id: currentUser.id,
                    nom_ingredient: nom, 
                    quantite: quantiteAjout 
                }]);
        }

        // On rafraîchit l'écran pour voir la mise à jour !
        chargerStocks();
    }

    // On lance l'application au démarrage
    verifierConnexion();
</script>

</body>
</html>
