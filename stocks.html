<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stocks - Gang of Pizza</title>
    <style>
        :root { --primary: #e74c3c; --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333; --input-bg: #2a2a2a; }
        body.light-mode { --bg: #f4f4f9; --card-bg: #ffffff; --text: #333333; --border: #dddddd; --input-bg: #eeeeee; }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; transition: 0.3s; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area img { height: 60px; }
        /* Gestion de l'affichage du logo selon le thème */
        .logo-light { display: none; }
        body.light-mode .logo-dark { display: none; }
        body.light-mode .logo-light { display: block; }
        .logo-area h1 { margin: 0; font-size: 1.4rem; color: var(--primary); }

        .nav-menu { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-menu a { text-decoration: none; padding: 12px 18px; background: var(--card-bg); color: var(--text); border-radius: 8px; font-weight: bold; border: 1px solid var(--border); }
        .nav-menu a.active { background: var(--primary); color: white; border-color: var(--primary); }

        .btn-action { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 1rem; }
        .btn-action:active { transform: scale(0.95); }

        /* Styles spécifiques aux Stocks (mise à jour pour alerte) */
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .stock-card { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border); border-left: 5px solid #2ecc71; display: flex; flex-direction: column; gap: 10px; position: relative; font-size: 1.1rem;}
        
        /* Alerte Seuil */
        .stock-card.alerte { border-left-color: var(--primary); background: rgba(231, 76, 60, 0.05); }
        .alerte-icon { position: absolute; top: 10px; right: 10px; color: var(--primary); font-size: 1.2rem; display: none; }
        .stock-card.alerte .alerte-icon { display: block; }

        .stock-info { display: flex; justify-content: space-between; align-items: center; }
        .stock-name { font-weight: bold; max-width: 70%; }
        .stock-qty { background: #2ecc71; color: white; padding: 6px 15px; border-radius: 20px; font-weight: bold; }
        .stock-card.alerte .stock-qty { background: var(--primary); }

        /* Zone de réglage du seuil */
        .seuil-zone { border-top: 1px solid var(--border); padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .seuil-zone label { font-size: 0.8rem; color: #888; }
        .seuil-input { width: 70px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 5px; border-radius: 5px; text-align: center; }

        /* MODALE LIVRAISON */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); margin: 2vh auto; padding: 25px; border: 1px solid var(--border); width: 90%; max-width: 600px; border-radius: 16px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close { font-size: 30px; cursor: pointer; color: var(--text); }
        
        .livraison-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .livraison-input { width: 80px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <h1>Espace Production by</h1>
            <img src="logo.png" alt="Logo" class="logo-dark" onerror="this.style.display='none'">
            <img src="logo-clair.png" alt="Logo" class="logo-light" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right; display: flex; align-items: center; gap: 15px;">
            <div id="user-email" style="font-size: 0.85em; color: #888; font-weight: bold;"></div>
            <button onclick="toggleTheme()" class="btn-action" style="background: var(--card-bg); color: var(--text); border: 1px solid var(--border);">🌓 Thème</button>
            <button onclick="seDeconnecter()" class="btn-action" style="background: #e74c3c; color: white;">Déconnexion</button>
        </div>
    </div>

    <div class="nav-menu">
        <a href="/production">Production</a>
        <a href="/stocks" id="nav-stocks">Stocks</a>
        <a href="/distributeurs">Distributeurs</a>
        <a href="/pointeuse">Pointeuse</a>
        <a href="/historique">Historique</a>
        <a href="/ventes" class="active">Ventes</a>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; color: var(--primary);">Vos stocks actuels</h2>
        <button class="btn-action" style="background: #3498db; color: white;" onclick="ouvrirModalLivraison()">🚚 Arrivage Livraison</button>
    </div>

    <div id="liste-stocks" class="stock-grid">
        <p style="color: #888;">Chargement des stocks...</p>
    </div>
</div>

<div id="modal-livraison" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="margin: 0; color: var(--primary);">🚚 Saisie Livraison</h2>
            <span class="close" onclick="fermerModalLivraison()">&times;</span>
        </div>
        <p style="color:#888; margin-bottom: 20px;">Saisissez les quantités reçues pour chaque produit :</p>
        <div id="form-livraison"></div>
        <button onclick="validerLivraison()" class="btn-action" style="background: #2ecc71; color: white; width: 100%; margin-top: 20px; font-size: 1.2rem;">Enregistrer la livraison</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
    const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    let currentUser = null;

    const PRODUITS_MASTER = [
        "Disque tomaté", "Disque crémé", "Scalarella (g)", "Jambon (g)", "Emmental râpé (g)", 
        "Roquefort (g)", "Chèvre (tranches)", "Olives noires (unités)", "Oignons pré-frits (g)",
        "Egrené au boeuf (g)", "Sauce burger (g)", "Cornichons (rondelles)", "Scalarella + Cheddar (g)",
        "Camembert (entier)", "Allumettes fumées (g)", "Merguez (rondelles)", "Poulet rôti (g)",
        "Sauce hot BBQ (g)", "Miel (g)", "Sauce fromagère (g)", "Nutella (g)", "M&M's (unités)",
        "Pommes de terre (g)", "Saucisses fumées (g)", "Comté râpé (g)", "Epices curry (g)",
        "Sauce curry (g)", "Poivrons grillés (g)", "Epices kebab (g)", "Viande kebab (g)",
        "Sauce blanche (g)", "Tomates confites (demi-tomates)", "Reblochon (entier)", "Boursin (g)", "Saumon fumé (g)"
    ];

    async function verifierConnexion() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = "/connexion"; return; }
        currentUser = session.user;
        document.getElementById('user-email').innerText = currentUser.email;

        // Vérification de l'abonnement
        const { data: profil } = await supabaseClient.from('profiles').select('type_abonnement').eq('id', currentUser.id).single();
        if (profil && profil.type_abonnement === 'Basic') {
            alert("L'abonnement Basic n'inclut pas la gestion des stocks. Veuillez contacter le support pour passer à l'offre supérieure.");
            window.location.href = "/production";
            return;
        }

        chargerStocks();
    }

    async function seDeconnecter() {
        await supabaseClient.auth.signOut();
        window.location.href = "/connexion";
    }

    async function chargerStocks() {
        const { data: dbStocks, error } = await supabaseClient.from('stocks').select('*');
        const container = document.getElementById('liste-stocks');
        container.innerHTML = "";

        if (error) { container.innerHTML = `<p style="color: red;">Erreur de chargement.</p>`; return; }

        PRODUITS_MASTER.sort().forEach(nom => {
            const data = dbStocks?.find(s => s.nom_ingredient === nom) || { quantite: 0, seuil_alerte: 0 };
            const estEnAlerte = data.quantite <= data.seuil_alerte && data.seuil_alerte > 0;
            
            let unite = (nom.includes("Disque") || nom.includes("unités") || nom.includes("tomates") || nom.includes("tranches") || nom.includes("entier") || nom.includes("rondelles")) ? "" : " g";

            container.innerHTML += `
                <div class="stock-card ${estEnAlerte ? 'alerte' : ''}">
                    <div class="alerte-icon">⚠️</div>
                    <div class="stock-info">
                        <span class="stock-name">${nom}</span>
                        <span class="stock-qty">${data.quantite}${unite}</span>
                    </div>
                    <div class="seuil-zone">
                        <label>Seuil d'alerte :</label>
                        <input type="number" class="seuil-input" value="${data.seuil_alerte}" 
                            onchange="majSeuil('${nom}', this.value)" placeholder="0">
                    </div>
                </div>
            `;
        });
    }

    async function majSeuil(nom, valeur) {
        const seuil = parseFloat(valeur) || 0;
        const { data: existant } = await supabaseClient.from('stocks').select('id').eq('nom_ingredient', nom).single();

        if (existant) {
            await supabaseClient.from('stocks').update({ seuil_alerte: seuil }).eq('id', existant.id);
        } else {
            await supabaseClient.from('stocks').insert([{ user_id: currentUser.id, nom_ingredient: nom, quantite: 0, seuil_alerte: seuil }]);
        }
        chargerStocks();
    }

    function ouvrirModalLivraison() {
        document.getElementById('modal-livraison').style.display = "block";
        const form = document.getElementById('form-livraison');
        form.innerHTML = PRODUITS_MASTER.sort().map(nom => `
            <div class="livraison-row">
                <span style="font-size:0.9rem;">${nom}</span>
                <input type="number" class="livraison-input" data-prod="${nom}" placeholder="0" min="0">
            </div>
        `).join('');
    }

    function fermerModalLivraison() { document.getElementById('modal-livraison').style.display = "none"; }

    async function validerLivraison() {
        const inputs = document.querySelectorAll('.livraison-input');
        
        for (const input of inputs) {
            const qte = parseFloat(input.value);
            if (qte > 0) {
                const nom = input.dataset.prod;
                const { data: existant } = await supabaseClient.from('stocks').select('*').eq('nom_ingredient', nom).single();
                
                if (existant) {
                    await supabaseClient.from('stocks').update({ quantite: existant.quantite + qte }).eq('id', existant.id);
                } else {
                    await supabaseClient.from('stocks').insert([{ user_id: currentUser.id, nom_ingredient: nom, quantite: qte }]);
                }
            }
        }
        fermerModalLivraison();
        chargerStocks();
        alert("Livraison enregistrée avec succès !");
    }

    verifierConnexion();
</script>
</body>
</html>
