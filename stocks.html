<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stocks - Gang of Pizza</title>
    <style>
        :root { --primary: #e74c3c; --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333; }
        body.light-mode { --bg: #f4f4f9; --card-bg: #ffffff; --text: #333333; --border: #dddddd; }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; transition: 0.3s; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area img { height: 40px; }
        .logo-area h1 { margin: 0; font-size: 1.4rem; color: var(--primary); }

        .nav-menu { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-menu a { text-decoration: none; padding: 12px 18px; background: var(--card-bg); color: var(--text); border-radius: 8px; font-weight: bold; border: 1px solid var(--border); }
        .nav-menu a.active { background: var(--primary); color: white; border-color: var(--primary); }

        .btn-action { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 1rem; }
        .btn-action:active { transform: scale(0.95); }

        /* Styles spécifiques aux Stocks */
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .stock-card { background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border); border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
        .stock-name { font-weight: bold; }
        .stock-qty { background: var(--primary); color: white; padding: 6px 15px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <h1>Gang of Pizza</h1>
        </div>
        <div style="text-align: right; display: flex; align-items: center; gap: 15px;">
            <div id="user-email" style="font-size: 0.85em; color: #888; font-weight: bold;"></div>
            <button onclick="toggleTheme()" class="btn-action" style="background: var(--card-bg); color: var(--text); border: 1px solid var(--border);">🌓 Thème</button>
            <button onclick="seDeconnecter()" class="btn-action" style="background: #e74c3c; color: white;">Déconnexion</button>
        </div>
    </div>

    <div class="nav-menu">
        <a href="production.html">Production</a>
        <a href="stocks.html" class="active">Stocks</a>
        <a href="distributeurs.html">Distributeurs</a>
        <a href="historique.html">Historique</a>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; color: var(--primary);">📦 État des Stocks</h2>
        <button class="btn-action" style="background: #3498db; color: white;" onclick="ajouterLivraison()">+ Saisir une Livraison</button>
    </div>

    <div id="liste-stocks" class="stock-grid">
        <p style="color: #888;">Chargement des stocks...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    const supabaseUrl = 'https://rantwcxfgosrhgdepjxb.supabase.co';
    const supabaseKey = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    let currentUser = null;

    async function verifierConnexion() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = "index.html"; return; }
        currentUser = session.user;
        document.getElementById('user-email').innerText = currentUser.email;
        chargerStocks();
    }

    async function seDeconnecter() {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
    }

    async function chargerStocks() {
        const { data: stocks, error } = await supabaseClient.from('stocks').select('*').order('nom_ingredient', { ascending: true });
        const container = document.getElementById('liste-stocks');
        
        if (error) { container.innerHTML = `<p style="color: red;">Erreur de chargement.</p>`; return; }
        if (stocks.length === 0) { container.innerHTML = `<p style="color: #888;">Votre stock est vide.</p>`; return; }

        container.innerHTML = stocks.map(item => {
            let unite = (item.nom_ingredient.includes("Disque") || item.nom_ingredient.includes("unités") || item.nom_ingredient.includes("demi-tomates") || item.nom_ingredient.includes("tranches") || item.nom_ingredient.includes("entier")) ? "" : " g";
            return `
            <div class="stock-card">
                <span class="stock-name">${item.nom_ingredient}</span>
                <span class="stock-qty">${item.quantite}${unite}</span>
            </div>`;
        }).join('');
    }

    async function ajouterLivraison() {
        let nom = prompt("Nom de l'ingrédient livré (ex: Emmental râpé (g)) :");
        if (!nom) return; 

        if(nom.toLowerCase().includes("camembert")) nom = "Camembert (entier)";
        if(nom.toLowerCase().includes("reblochon")) nom = "Reblochon (entier)";

        let quantiteAjout = parseFloat(prompt(`Quantité reçue pour : ${nom} ?`));
        if (isNaN(quantiteAjout) || quantiteAjout <= 0) { alert("Quantité invalide."); return; }

        const { data: existant } = await supabaseClient.from('stocks').select('*').eq('nom_ingredient', nom).single();

        if (existant) {
            await supabaseClient.from('stocks').update({ quantite: existant.quantite + quantiteAjout }).eq('id', existant.id);
        } else {
            await supabaseClient.from('stocks').insert([{ user_id: currentUser.id, nom_ingredient: nom, quantite: quantiteAjout }]);
        }
        chargerStocks();
    }

    verifierConnexion();
</script>
</body>
</html>
