<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventes - Gang of Pizza</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navbar unifiée avec les autres pages -->
    <header class="bg-red-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-tight flex items-center gap-2">
                <span>🍕</span> Gang of Pizza
            </h1>
            <nav class="flex items-center space-x-6 text-sm font-medium">
                <a href="/production" class="hover:text-red-100 transition-colors">Production</a>
                <a href="/stocks" class="hover:text-red-100 transition-colors">Stocks</a>
                <a href="/ventes" class="bg-red-700 px-3 py-1.5 rounded-md text-white font-semibold shadow-inner">Ventes</a>
                <a href="/distributeurs" class="hover:text-red-100 transition-colors">Distributeurs</a>
            </nav>
        </div>
    </header>

    <!-- Contenu principal aligné et épuré -->
    <main class="max-w-7xl w-full mx-auto p-4 md:p-6 flex-grow">
        
        <!-- En-tête de section -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div>
                <h2 class="text-xl font-bold text-slate-800">Classement des Ventes</h2>
                <p class="text-xs text-slate-500 mt-0.5">Analyse des volumes de pizzas écoulées par période calendaire</p>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap w-full sm:w-auto justify-start sm:justify-end">
                <div class="inline-flex bg-slate-100 p-1 rounded-lg border border-slate-200">
                    <button onclick="filtrerJours(2)" class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all btn-filtre text-slate-600 hover:text-slate-900" data-jours="2">2 jours</button>
                    <button onclick="filtrerJours(3)" class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all btn-filtre text-slate-600 hover:text-slate-900" data-jours="3">3 jours</button>
                    <button onclick="filtrerJours(5)" class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all btn-filtre text-slate-600 hover:text-slate-900" data-jours="5">5 jours</button>
                    <button onclick="filtrerJours(7)" class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all btn-filtre bg-white text-slate-900 shadow-sm" data-jours="7">7 jours</button>
                </div>
                <button onclick="syncVentes()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold shadow-sm transition-all flex items-center gap-1.5">
                    <span>🔄</span> Synchro Ventes
                </button>
            </div>
        </div>

        <!-- Tableau au design standardisé -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse text-left text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[11px] font-bold tracking-wider">
                            <th class="py-3.5 px-4 w-28">Classement</th>
                            <th class="py-3.5 px-4">Nom de la Pizza</th>
                            <th class="py-3.5 px-4 text-right">Quantité Vendue</th>
                        </tr>
                    </thead>
                    <tbody id="tableau-ventes" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="3" class="p-8 text-center text-slate-400 text-sm">Chargement des ventes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://rantwcxfgosrhgdepjxb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nt49Vf58IiqAfQ8Wtsb5Gw_qLB5Of-v'; 
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let joursActuels = 7;

        async function chargerVentes(jours = 7) {
            joursActuels = jours;
            
            // Mise à jour visuelle des boutons de filtre (style unifié)
            document.querySelectorAll('.btn-filtre').forEach(btn => {
                if(parseInt(btn.dataset.jours) === jours) {
                    btn.className = "px-3 py-1.5 text-xs font-semibold rounded-md transition-all btn-filtre bg-white text-slate-900 shadow-sm";
                } else {
                    btn.className = "px-3 py-1.5 text-xs font-semibold rounded-md transition-all btn-filtre text-slate-600 hover:text-slate-900";
                }
            });

            const dateLimite = new Date();
            dateLimite.setDate(dateLimite.getDate() - (jours - 1)); // -1 pour inclure la journée entière en cours
            dateLimite.setHours(0, 0, 0, 0); // Remet à minuit pile

            const { data: ventes, error } = await db
                .from('machine_ventes')
                .select('*')
                .gte('date_vente', dateLimite.toISOString());

            const tbody = document.getElementById('tableau-ventes');

            if (error) {
                console.error("Erreur Supabase:", error);
                tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-red-500 text-sm font-medium">Erreur de chargement : ${error.message}</td></tr>`;
                return;
            }

            if (!ventes || ventes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-400 text-sm italic">Aucune vente enregistrée sur ces ${jours} derniers jours. Cliquez sur "Synchro Ventes".</td></tr>`;
                return;
            }

            // Agréger les ventes par nom de pizza en filtrant les "Vente Standard"
            const aggregation = {};
            ventes.forEach(v => {
                const nom = v.nom_pizza || "Inconnue";
                if (!nom.includes("Vente Standard")) {
                    aggregation[nom] = (aggregation[nom] || 0) + (v.quantite || 1);
                }
            });

            // Trier par ordre décroissant
            const classement = Object.entries(aggregation).sort((a, b) => b[1] - a[1]);

            tbody.innerHTML = "";
            classement.forEach(([pizza, qte], index) => {
                let badgeRank = `<span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-700">#${index + 1}</span>`;
                if(index === 0) badgeRank = `<span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">🏆 #1</span>`;
                else if(index === 1) badgeRank = `<span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-bold bg-slate-200 text-slate-800">🥈 #2</span>`;
                else if(index === 2) badgeRank = `<span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-bold bg-orange-100 text-orange-800">🥉 #3</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="py-3.5 px-4">${badgeRank}</td>
                        <td class="py-3.5 px-4 font-medium text-slate-800">${pizza}</td>
                        <td class="py-3.5 px-4 text-right font-bold text-red-600">${qte}</td>
                    </tr>
                `;
            });
        }

        function filtrerJours(j) {
            chargerVentes(j);
        }

        async function syncVentes() {
            try {
                const btn = event.target;
                const originalText = btn.innerHTML;
                btn.innerHTML = "<span>⏳</span> Synchro...";
                btn.disabled = true;

                const res = await fetch("https://rantwcxfgosrhgdepjxb.supabase.co/functions/v1/sync-ventes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const data = await res.json();
                
                btn.innerHTML = originalText;
                btn.disabled = false;

                if(!res.ok) throw new Error(data.error);
                
                chargerVentes(joursActuels);
            } catch(err) {
                alert("Erreur de synchronisation : " + err.message);
                const btn = event.target;
                if(btn) {
                    btn.innerHTML = "<span>🔄</span> Synchro Ventes";
                    btn.disabled = false;
                }
            }
        }

        // Chargement par défaut sur 7 jours au démarrage
        chargerVentes(7);
    </script>
</body>
</html>
